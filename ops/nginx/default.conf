server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker's embedded DNS. Compose hands containers new IPs on every recreate, so the
    # upstreams are resolved per request instead of once at startup.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ~ ^/(api|admin|static|healthz|readyz) {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # SSE booking status stream
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        set $web_upstream http://web:5173;
        proxy_pass $web_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
