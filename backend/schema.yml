        * `AUTHORISED` - Authorised
        * `CAPTURED` - Captured
        * `FAILED` - Failed
        * `REFUNDED` - Refunded
        * `PARTIALLY_REFUNDED` - Partially refunded
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
      required:
      - email
      - password
    Route:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        airline:
          type: string
        origin_airport:
          type: string
        destination_airport:
          type: string
        is_active:
          type: boolean
      required:
      - airline
      - destination_airport
      - id
      - origin_airport
    RouteRequest:
      type: object
      properties:
        airline:
          type: string
          minLength: 1
        origin_airport:
          type: string
          minLength: 1
        destination_airport:
          type: string
          minLength: 1
        is_active:
          type: boolean
      required:
      - airline
      - destination_airport
      - origin_airport
    SandboxConfirmRequest:
      type: object
      description: |-
        Stands in for the provider's browser SDK.

        The card number is used to pick a deterministic sandbox outcome and is never stored, logged
        or echoed — only the brand and last four survive the call (CLAUDE.md invariant 9).
      properties:
        card_number:
          type: string
          writeOnly: true
          minLength: 1
          pattern: ^\d{12,19}$
      required:
      - card_number
    ScheduleStatusEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      - RETIRED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
        * `RETIRED` - Retired
    SearchRequestRequest:
      type: object
      properties:
        trip_type:
          allOf:
          - $ref: '#/components/schemas/TripTypeEnum'
          default: ONE_WAY
        slices:
          type: array
          items:
            $ref: '#/components/schemas/SliceRequest'
        passengers:
          $ref: '#/components/schemas/PassengersRequest'
        cabin:
          allOf:
          - $ref: '#/components/schemas/CabinEnum'
          default: ECONOMY
        currency:
          type: string
          minLength: 1
          default: USD
          maxLength: 3
        max_stops:
          type: integer
          maximum: 2
          minimum: 0
          default: 1
      required:
      - passengers
      - slices
    SearchResponse:
      type: object
      properties:
        trip_type:
          type: string
        currency:
          type: string
        partial:
          type: boolean
        slices:
          type: array
          items:
            $ref: '#/components/schemas/SearchSliceResult'
      required:
      - currency
      - partial
      - slices
      - trip_type
    SearchSliceResult:
      type: object
      properties:
        index:
          type: integer
        search_id:
          type: string
          format: uuid
        origin:
          type: string
        destination:
          type: string
        date:
          type: string
          format: date
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
      required:
      - date
      - destination
      - index
      - offers
      - origin
      - search_id
    Seat:
      type: object
      properties:
        seat_number:
          type: string
          readOnly: true
        row:
          type: integer
          readOnly: true
        column:
          type: string
          readOnly: true
        cabin:
          allOf:
          - $ref: '#/components/schemas/CabinEnum'
          readOnly: true
        characteristics:
          type: array
          items:
            type: string
            maxLength: 20
          readOnly: true
        is_exit_row:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SeatStatusEnum'
          readOnly: true
        seat_fee_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        seat_fee_currency:
          type: string
          readOnly: true
      required:
      - cabin
      - characteristics
      - column
      - is_exit_row
      - row
      - seat_fee_amount
      - seat_fee_currency
      - seat_number
      - status
    SeatMapTemplate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        aircraft:
          type: integer
        layout: {}
      required:
      - aircraft
      - id
      - name
    SeatMapTemplateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        aircraft:
          type: integer
        layout: {}
      required:
      - aircraft
      - name
    SeatStatusEnum:
      enum:
      - AVAILABLE
      - HELD
      - ASSIGNED
      - BLOCKED
      type: string
      description: |-
        * `AVAILABLE` - Available
        * `HELD` - Held
        * `ASSIGNED` - Assigned
        * `BLOCKED` - Blocked
    SliceRequest:
      type: object
      properties:
        origin:
          type: string
          minLength: 3
          maxLength: 3
        destination:
          type: string
          minLength: 3
          maxLength: 3
        date:
          type: string
          format: date
      required:
      - date
      - destination
      - origin
    ThreeDsStatusEnum:
      enum:
      - NOT_REQUIRED
      - REQUIRED
      - AUTHENTICATED
      - FAILED
      type: string
      description: |-
        * `NOT_REQUIRED` - Not required
        * `REQUIRED` - Required
        * `AUTHENTICATED` - Authenticated
        * `FAILED` - Failed
    Ticket:
      type: object
      properties:
        ticket_number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        passenger_name:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        fare:
          type: string
          readOnly: true
        taxes:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        fare_calculation:
          type: string
          readOnly: true
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/TicketCoupon'
          readOnly: true
      required:
      - coupons
      - fare
      - fare_calculation
      - issued_at
      - passenger_name
      - status
      - taxes
      - ticket_number
      - total
    TicketCoupon:
      type: object
      properties:
        coupon_number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketCouponStatusEnum'
          readOnly: true
        designator:
          type: string
          readOnly: true
        origin:
          type: string
          readOnly: true
        destination:
          type: string
          readOnly: true
        departure_local:
          type: string
          format: date-time
          readOnly: true
        flown_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - coupon_number
      - departure_local
      - designator
      - destination
      - flown_at
      - origin
      - status
    TicketCouponStatusEnum:
      enum:
      - OPEN
      - CHECKED_IN
      - LIFTED
      - FLOWN
      - EXCHANGED
      - REFUNDED
      - VOID
      type: string
      description: |-
        * `OPEN` - Open for use
        * `CHECKED_IN` - Checked in
        * `LIFTED` - Lifted
        * `FLOWN` - Flown
        * `EXCHANGED` - Exchanged
        * `REFUNDED` - Refunded
        * `VOID` - Void
    TicketStatusEnum:
      enum:
      - ISSUED
      - EXCHANGED
      - REFUNDED
      - VOID
      type: string
      description: |-
        * `ISSUED` - Issued
        * `EXCHANGED` - Exchanged
        * `REFUNDED` - Refunded
        * `VOID` - Void
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Traveller:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        dob:
          type:
          - string
          - 'null'
          format: date
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        nationality:
          type: string
          maxLength: 2
        doc_type:
          oneOf:
          - $ref: '#/components/schemas/DocTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        doc_expiry:
          type:
          - string
          - 'null'
          format: date
        doc_issuing_country:
          type: string
          maxLength: 2
        frequent_flyer_number:
          type: string
          maxLength: 32
        is_primary:
          type: boolean
      required:
      - first_name
      - last_name
      - public_id
    TravellerRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        dob:
          type:
          - string
          - 'null'
          format: date
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        nationality:
          type: string
          maxLength: 2
        doc_type:
          oneOf:
          - $ref: '#/components/schemas/DocTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        doc_number:
          type: string
          writeOnly: true
          maxLength: 64
        doc_expiry:
          type:
          - string
          - 'null'
          format: date
        doc_issuing_country:
          type: string
          maxLength: 2
        frequent_flyer_number:
          type: string
          maxLength: 32
        is_primary:
          type: boolean
      required:
      - first_name
      - last_name
    TripTypeEnum:
      enum:
      - ONE_WAY
      - ROUND_TRIP
      - MULTI_CITY
      type: string
      description: |-
        * `ONE_WAY` - One way
        * `ROUND_TRIP` - Round trip
        * `MULTI_CITY` - Multi city
    TypeEnum:
      enum:
      - ADT
      - CHD
      - INF
      type: string
      description: |-
        * `ADT` - Adult
        * `CHD` - Child
        * `INF` - Infant
    User:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        locale:
          type: string
          maxLength: 10
        mfa_enabled:
          type: boolean
          readOnly: true
        roles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - mfa_enabled
      - public_id
      - roles
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
