openapi: 3.1.0
info:
  title: Wayfare API
  version: 1.0.0
  description: Flight inventory, booking and air-ticket management.
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/aircraft:
    get:
      operationId: aircraft_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aircraft'
          description: ''
  /api/v1/airlines:
    get:
      operationId: airlines_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airline'
          description: ''
  /api/v1/airports:
    get:
      operationId: airports_list
      description: 'Airport typeahead. Public: the search box is the first thing an
        anonymous visitor uses.'
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: ISO-3166 alpha-2 filter
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: 'Free text: IATA code, airport or city name'
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Airport'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: See ``TokenObtainPairView.post``; adds the login throttle scope.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: See ``TokenRefreshView.post``; rotation and blacklisting are configured
        in SIMPLE_JWT.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/bookings:
    post:
      operationId: bookings_create
      description: Re-validates the offer's signature and expiry, re-reads availability
        under lock, holds the seats and mints a PNR. Requires an Idempotency-Key header.
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{pnr}:
    get:
      operationId: bookings_retrieve
      description: |-
        Retrieve a booking by PNR.

        Owner or staff get it from the ownership-filtered selector; everyone else must supply the
        lead surname, and gets a 404 — never a 403 — when it does not match, so the endpoint cannot
        be used to confirm that a PNR exists.
      parameters:
      - in: query
        name: last_name
        schema:
          type: string
        description: Required for guest retrieval; ignored when authenticated as the
          owner.
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{pnr}/payment-intents:
    post:
      operationId: bookings_payment_intents_create
      description: |-
        Open a provider intent for a booking's balance.

        The response carries a ``client_secret``: the SPA sends the card straight to the provider
        with it, so no card data ever reaches Wayfare.
      parameters:
      - in: query
        name: last_name
        schema:
          type: string
        description: Required for guest access
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
  /api/v1/bookings/{pnr}/payment-intents/{intent_id}:
    get:
      operationId: bookings_payment_intents_retrieve
      description: Poll one intent. The booking itself is the source of truth for
        whether it is ticketed.
      parameters:
      - in: path
        name: intent_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: last_name
        schema:
          type: string
        description: Required for guest access
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
  /api/v1/bookings/{pnr}/payment-intents/{intent_id}/confirm:
    post:
      operationId: bookings_payment_intents_confirm_create
      description: Sandbox only — stands in for the provider's browser SDK. Confirms
        an intent with a test card and emits the same signed webhook a real provider
        would.
      parameters:
      - in: path
        name: intent_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SandboxConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SandboxConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
  /api/v1/bookings/{pnr}/payments:
    get:
      operationId: bookings_payments_list
      parameters:
      - in: query
        name: last_name
        schema:
          type: string
        description: Required for guest access
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/bookings/{pnr}/tickets:
    get:
      operationId: bookings_tickets_list
      description: |-
        E-tickets and coupon status for one booking.

        Returns an empty list rather than a 404 for a booking with no tickets yet — the client
        polls this while `issue_tickets` runs.
      parameters:
      - in: query
        name: last_name
        schema:
          type: string
        description: Required for guest access
      - in: path
        name: pnr
        schema:
          type: string
        required: true
      tags:
      - ticketing
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
          description: ''
  /api/v1/collect:
    post:
      operationId: collect_create
      description: |-
        Clickstream sink for navigator.sendBeacon.

        AllowAny: the storefront is anonymous until checkout, so most funnel events have no user.
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CollectBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CollectBatchRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/currencies:
    get:
      operationId: currencies_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
          description: ''
  /api/v1/flights/{public_id}/seatmap:
    get:
      operationId: flights_seatmap_list
      description: Public seat map for a flight. Prices come from the seat rows, not
        a pricing call.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/me/travellers/:
    get:
      operationId: me_travellers_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTravellerList'
          description: ''
    post:
      operationId: me_travellers_create
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traveller'
          description: ''
  /api/v1/me/travellers/{public_id}/:
    get:
      operationId: me_travellers_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traveller'
          description: ''
    put:
      operationId: me_travellers_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TravellerRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traveller'
          description: ''
    patch:
      operationId: me_travellers_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTravellerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTravellerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTravellerRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Traveller'
          description: ''
    delete:
      operationId: me_travellers_destroy
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/offers/{offer_id}:
    get:
      operationId: offers_retrieve
      description: |-
        Re-validate an offer: signature, expiry, identity.

        Returns 409 ``offer_expired`` or ``offer_invalid`` rather than a stale price.
      parameters:
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - search
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/v1/ops/flights/:
    get:
      operationId: ops_flights_list
      parameters:
      - in: query
        name: airline
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: destination_airport
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: origin_airport
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARRIVED
          - BOARDING
          - CANCELLED
          - DELAYED
          - DEPARTED
          - DIVERTED
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `DELAYED` - Delayed
          * `BOARDING` - Boarding
          * `DEPARTED` - Departed
          * `ARRIVED` - Arrived
          * `CANCELLED` - Cancelled
          * `DIVERTED` - Diverted
      tags:
      - ops
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlightList'
          description: ''
  /api/v1/ops/flights/{public_id}/:
    get:
      operationId: ops_flights_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightDetail'
          description: ''
    patch:
      operationId: ops_flights_partial_update
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFlightOpsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFlightOpsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFlightOpsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightOps'
          description: ''
  /api/v1/ops/flights/{public_id}/inventory/:
    get:
      operationId: ops_flights_inventory_list
      description: |-
        Read or adjust cabin capacity and the RBD ladder.

        One action serves both verbs: two actions sharing a url_path collide in the router.

        Capacity may not drop below what is already sold and held, and an RBD authorisation may
        not drop below its own sold count — either would put the flight into a state the
        check constraints reject.
      parameters:
      - in: query
        name: airline
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: destination_airport
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: origin_airport
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARRIVED
          - BOARDING
          - CANCELLED
          - DELAYED
          - DEPARTED
          - DIVERTED
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `DELAYED` - Delayed
          * `BOARDING` - Boarding
          * `DEPARTED` - Departed
          * `ARRIVED` - Arrived
          * `CANCELLED` - Cancelled
          * `DIVERTED` - Diverted
      tags:
      - ops
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCabinConfigList'
          description: ''
    patch:
      operationId: ops_flights_inventory_partial_update
      description: |-
        Read or adjust cabin capacity and the RBD ladder.

        One action serves both verbs: two actions sharing a url_path collide in the router.

        Capacity may not drop below what is already sold and held, and an RBD authorisation may
        not drop below its own sold count — either would put the flight into a state the
        check constraints reject.
      parameters:
      - in: query
        name: airline
        schema:
          type: string
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: destination_airport
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: origin_airport
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARRIVED
          - BOARDING
          - CANCELLED
          - DELAYED
          - DEPARTED
          - DIVERTED
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `DELAYED` - Delayed
          * `BOARDING` - Boarding
          * `DEPARTED` - Departed
          * `ARRIVED` - Arrived
          * `CANCELLED` - Cancelled
          * `DIVERTED` - Diverted
      tags:
      - ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInventoryUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInventoryUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInventoryUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCabinConfigList'
          description: ''
