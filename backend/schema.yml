components:
  schemas:
    Aircraft:
      type: object
      properties:
        iata_type_code:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 100
        manufacturer:
          type: string
          maxLength: 100
        total_seats_default:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - iata_type_code
      - name
    Airline:
      type: object
      properties:
        iata_code:
          type: string
          maxLength: 2
        icao_code:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 150
        country:
          type: string
          readOnly: true
        logo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - country
      - iata_code
      - name
    Airport:
      type: object
      properties:
        iata_code:
          type: string
          maxLength: 3
        icao_code:
          type: string
          maxLength: 4
        name:
          type: string
          maxLength: 150
        city:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        country_code:
          type: string
          readOnly: true
        timezone:
          type: string
          description: IANA name; schedules are authored here
          maxLength: 64
        latitude:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - city
      - country
      - country_code
      - iata_code
      - name
      - timezone
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      properties:
        pnr:
          type: string
          readOnly: true
        public_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        trip_type:
          allOf:
          - $ref: '#/components/schemas/TripTypeEnum'
          readOnly: true
        currency:
          type: string
          readOnly: true
        base:
          type: string
          readOnly: true
        taxes:
          type: string
          readOnly: true
        fees:
          type: string
          readOnly: true
        discount:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        balance_due:
          type: string
          readOnly: true
        contact_email:
          type: string
          format: email
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        hold_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        booked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        segments:
          type: array
          items:
            $ref: '#/components/schemas/BookingSegment'
          readOnly: true
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
          readOnly: true
      required:
      - balance_due
      - base
      - booked_at
      - contact_email
      - contact_phone
      - currency
      - discount
      - fees
      - hold_expires_at
      - passengers
      - pnr
      - public_id
      - segments
      - status
      - taxes
      - total
      - trip_type
    BookingClass:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rbd:
          type: string
          maxLength: 1
        authorised:
          type: integer
          maximum: 32767
          minimum: 0
        sold:
          type: integer
          readOnly: true
        held:
          type: integer
          readOnly: true
        seats_available:
          type: integer
          readOnly: true
        is_open:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - held
      - id
      - rbd
      - seats_available
      - sold
    BookingCreateRequest:
      type: object
      properties:
        offer_id:
          type: string
          format: uuid
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/PassengerInputRequest'
        contact:
          $ref: '#/components/schemas/ContactRequest'
      required:
      - contact
      - offer_id
      - passengers
    BookingSegment:
      type: object
      properties:
        sequence:
          type: integer
          readOnly: true
        flight_public_id:
          type: string
          format: uuid
          readOnly: true
        designator:
          type: string
          readOnly: true
        origin:
          type: string
          readOnly: true
        destination:
          type: string
          readOnly: true
        departure_utc:
          type: string
          format: date-time
          readOnly: true
        arrival_utc:
          type: string
          format: date-time
          readOnly: true
        departure_local:
          type: string
          format: date-time
          readOnly: true
        arrival_local:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        cabin:
          allOf:
          - $ref: '#/components/schemas/CabinEnum'
          readOnly: true
        rbd:
          type: string
          readOnly: true
        fare_basis:
          type: string
          readOnly: true
