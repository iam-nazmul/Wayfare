[project]
name = "wayfare-backend"
version = "0.1.0"
description = "Wayfare — flight inventory, booking and air-ticket management API"
requires-python = ">=3.13"

dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "djangorestframework-simplejwt>=5.5",
    "django-filter>=25.1",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery[redis]>=5.5",
    "django-celery-beat>=2.8",
    "clickhouse-connect>=0.9",
    "structlog>=25.1",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "django-prometheus>=2.3",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.34",
    "whitenoise>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers -p no:cacheprovider"
testpaths = ["apps", "tests"]
