name: wayfare

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wayfare}
      POSTGRES_USER: ${POSTGRES_USER:-wayfare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wayfare}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wayfare} -d ${POSTGRES_DB:-wayfare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-wayfare}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./ops/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-9000}:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ch_migrate &&
             python manage.py collectstatic --noinput"
    restart: "no"

  api:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker-critical:
    <<: *backend
    command: celery -A config worker -Q critical -c 4 -l info -n critical@%h
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker-default:
    <<: *backend
    command: celery -A config worker -Q default,maintenance -c 4 -l info -n default@%h
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker-notify:
    <<: *backend
    command: celery -A config worker -Q notifications -c 2 -l info -n notify@%h
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker-analytics:
    <<: *backend
    command: celery -A config worker -Q analytics -c 2 -l info -n analytics@%h
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: celery -A config beat -l info -S django
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
      VITE_PAYMENT_PUBLIC_KEY: ${VITE_PAYMENT_PUBLIC_KEY:-}
      VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # `npm run generate:api` reads ../backend/schema.yml, which is outside the build context.
      - ./backend/schema.yml:/backend/schema.yml:ro
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"

  nginx:
    image: nginx:alpine
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    depends_on:
      - api
      - web

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"

volumes:
  pgdata:
  redisdata:
  chdata:
